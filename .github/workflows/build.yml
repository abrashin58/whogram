name: Build iOS App

on:
  push:
    branches: [ "main", "whogram-2-redesign" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App (Unsigned)
      shell: bash
      run: |
        set -o pipefail
        xcodebuild build \
          -project Whogram.xcodeproj \
          -scheme Whogram \
          -configuration Debug \
          -destination 'generic/platform=iOS' \
          -sdk iphoneos \
          -jobs 2 \
          -resultBundlePath Whogram-build.xcresult \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" 2>&1 | tee build.log
    - name: Package to IPA
      run: |
        mkdir -p Payload
        mv ${{ github.workspace }}/build/Whogram.app Payload/
        zip -r Whogram.ipa Payload
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Whogram-IPA
        path: Whogram.ipa
        if-no-files-found: error
    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build.log
          Whogram-build.xcresult
