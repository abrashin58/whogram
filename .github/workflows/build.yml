name: Build iOS App

on:
  push:
    branches: [ "main", "whogram-2-redesign", "whogram-stability-icon", "whogram-session-recovery" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        type: choice
        options: [Debug, Release, Both]
        default: Both

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(inputs.configuration == 'Debug' && '["Debug"]' || inputs.configuration == 'Release' && '["Release"]' || '["Debug","Release"]') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Check Swift sources and core logic
      run: |
        bash scripts/check-syntax.sh
        bash scripts/check-core.sh

    - name: Build App (Unsigned)
      shell: bash
      env:
        BUILD_CONFIGURATION: ${{ matrix.configuration }}
      run: |
        set -o pipefail
        xcodebuild build \
          -project Whogram.xcodeproj \
          -scheme Whogram \
          -configuration "$BUILD_CONFIGURATION" \
          -destination 'generic/platform=iOS' \
          -sdk iphoneos \
          -jobs 2 \
          -resultBundlePath Whogram-build.xcresult \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" 2>&1 | tee build.log
    - name: Package to IPA
      run: |
        /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' build/Whogram.app/Info.plist | grep -Fx AppIcon
        mkdir -p Payload
        mv ${{ github.workspace }}/build/Whogram.app Payload/
        zip -r Whogram.ipa Payload
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Whogram-IPA-${{ matrix.configuration }}
        path: Whogram.ipa
        if-no-files-found: error
    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ matrix.configuration }}
        path: |
          build.log
          Whogram-build.xcresult
