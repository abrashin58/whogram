name: Whogram
options:
  bundleIdPrefix: com.whomakson
targets:
  Whogram:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: TDLibKit
packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    branch: main
