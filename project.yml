name: Whogram
options:
  bundleIdPrefix: com.whomakson
targets:
  Whogram:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      properties:
        UILaunchScreen: {}
    dependencies:
      - package: TDLibKit
packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    from: 1.8.31